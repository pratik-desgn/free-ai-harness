name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck, test, and scan tracked files
        run: npm run check
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Build production JavaScript
        run: npm run build

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate production Compose configuration
        env:
          HARNESS_ENV_FILE: .env.production.example
        run: docker compose --env-file deploy/.env.production.example -f deploy/docker-compose.yml config --quiet
      - name: Build production image
        run: docker build --pull --tag free-ai-harness:${{ github.sha }} .
      - name: Smoke-test production image
        env:
          IMAGE: free-ai-harness:${{ github.sha }}
        run: |
          container=$(docker run --detach --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev \
            --tmpfs /var/lib/free-ai-harness:rw,noexec,nosuid,nodev \
            --tmpfs /workspace:rw,noexec,nosuid,nodev \
            --publish 127.0.0.1::8790 \
            --env NODE_ENV=production \
            --env HARNESS_HOST=0.0.0.0 \
            --env HARNESS_VAULT_KEY=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --env HARNESS_LOGIN_PASSWORD=container-smoke-test-password \
            --env OLLAMA_ENABLED=false \
            "$IMAGE")
          trap 'docker logs "$container"; docker stop "$container"' EXIT
          port=$(docker port "$container" 8790/tcp | sed 's/.*://')
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "http://127.0.0.1:$port/health/ready"; then
              exit 0
            fi
            sleep 1
          done
          exit 1
