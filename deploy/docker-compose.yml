name: free-ai-harness

services:
  harness:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: ${HARNESS_VERSION:-local}
        REVISION: ${HARNESS_REVISION:-unknown}
    image: ${HARNESS_IMAGE:-free-ai-harness:local}
    restart: unless-stopped
    init: true
    env_file:
      - ${HARNESS_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      HARNESS_DATA_DIR: /var/lib/free-ai-harness
      HARNESS_WORKSPACE_ROOT: /workspace
      HARNESS_PORT: "8790"
      HARNESS_HOST: 0.0.0.0
      HARNESS_PUBLIC_ORIGIN: https://${HARNESS_DOMAIN:?set HARNESS_DOMAIN in the Compose environment}
      HARNESS_TRUST_PROXY: "true"
      HARNESS_SECURE_COOKIES: "true"
      OLLAMA_ENABLED: "false"
    expose:
      - "8790"
    volumes:
      - harness-data:/var/lib/free-ai-harness
      - harness-workspace:/workspace
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 20s
    networks:
      - frontend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      harness:
        condition: service_healthy
    environment:
      HARNESS_DOMAIN: ${HARNESS_DOMAIN:?set HARNESS_DOMAIN in the Compose environment}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in the Compose environment}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    networks:
      - frontend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  frontend:
    driver: bridge

volumes:
  harness-data:
  harness-workspace:
  caddy-data:
  caddy-config:
